<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head>
<body>
<div id="log">start</div>
<script>
window.onerror=function(m,s,l,c,e){document.getElementById('log').textContent='ERR '+m+' L'+l+' '+(e&&e.stack||'');};
window.addEventListener('error',function(e){document.getElementById('log').textContent='ERR2 '+e.message+' L'+e.lineno;});
</script>
<script src="app.js"></script>
<script>
try {
  var n = document.querySelectorAll('.nav-item,.dir-row,.keep-card,.card,#category-list,#notes-list').length;
  var build = typeof APP_BUILD!=='undefined' ? APP_BUILD : 'no';
  var log = document.getElementById('log');
  if (log.textContent==='start') log.textContent='OK build='+build+' nodes='+n+' bodyLen='+document.body.innerHTML.length;
} catch(e) {
  document.getElementById('log').textContent='FAIL '+e;
}
</script>
</body></html>
